name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Installer Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Aucun package-lock.json versionné pour l'instant : npm ci n'est pas utilisable.
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier les types TypeScript
        run: npm run check

      - name: Exécuter tous les tests (Vitest)
        run: npm test

      - name: Vérifier le build de production
        run: npm run build
