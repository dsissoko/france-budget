name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const t = process.env.PR_TITLE || ""; const ok = /^(feat|fix|docs|refactor|test|chore|build|ci|perf|style|revert)(\([a-zA-Z0-9._/-]+\))?(!)?: .+/.test(t) || /^chore\(main\): release .+/.test(t); if (!ok) { console.error("PR title must follow Conventional Commits: " + t); process.exit(1); }'

  verify:
    name: TypeScript, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Installer Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Aucun package-lock.json versionné pour l'instant : npm ci n'est pas utilisable.
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Vérifier les types TypeScript
        run: npm run check

      - name: Exécuter tous les tests (Vitest)
        run: npm test

      - name: Vérifier les CSV et les modes des programmes (sans écriture Neon)
        run: npm run test:programmes

      - name: Vérifier V2 (tests unitaires + CSV intégral, sans Neon)
        run: npm run test:v2

      - name: Auditer les textes publiables V2 (rapport non destructif)
        run: npm run audit:editorial:v2

      - name: Vérifier les liens et diagrammes de la documentation V2
        run: npm run docs:check

      - name: Vérifier le build de production
        run: npm run build
