name: "Programme politique — soumettre ou corriger une proposition"
description: "Soumettre ou corriger une proposition de budget politique avec source, identifiant stable et décision APU."
title: "[politique] "
body:
  - type: markdown
    attributes:
      value: "Cette issue n'implique aucune validation officielle. Même procédure pour tous les partis. Merci de ne publier aucune donnée personnelle sensible."
  - type: input
    id: programme
    attributes:
      label: "Formation (nom et code stable), programme et année"
      placeholder: "Par exemple : RN, contre-budget 2026 ; document du JJ/MM/AAAA"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: "Source primaire publique (URL + page / section)"
      placeholder: "https://... (programme, communiqué ou document de chiffrage)"
    validations:
      required: true
  - type: dropdown
    id: relation
    attributes:
      label: "Qualité déclarée du contributeur"
      options:
        - "Particulier / chercheur / observateur"
        - "Équipe d'un parti (habilitations non vérifiées)"
        - "Autre"
    validations:
      required: true
  - type: textarea
    id: mesure
    attributes:
      label: "Mesure et objectif"
      description: "Intitulé, description, calendrier, périmètre et population concernée."
    validations:
      required: true
  - type: textarea
    id: chiffrage
    attributes:
      label: "Montants revendiqués"
      description: "Recettes / dépenses ; Md€, année, ponctuel/récurrent, source de chaque montant. Préciser si aucun montant officiel n'existe."
    validations:
      required: true
  - type: textarea
    id: ventilation
    attributes:
      label: "Décision manuelle APU et ventilation proposée"
      description: "Préciser calculate, non_chiffrable_apu (avec justification) ou review_pending. Pour les mesures calculables : recettes/dépenses, catégorie existante, montant signé, somme de contrôle ; ne pas inventer de catégories."
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: "Identifiants existants ou proposés (non obligatoires pour une première soumission)"
      description: "Code de formation, source_year, group_id, source_row ou identifiant stable de mesure ; jamais le titre comme clé."
  - type: textarea
    id: coverage
    attributes:
      label: "Couverture du document et regroupement"
      description: "Programme entier ou extrait ? Liste des lignes sources regroupées, année et horizon des montants."
  - type: textarea
    id: hypotheses
    attributes:
      label: "Hypothèses, effets indirects et incertitudes"
      description: "Décrire les hypothèses non vérifiées et distinguer impact direct et projections économiques."
    validations:
      required: true
  - type: textarea
    id: interactions
    attributes:
      label: "Interactions ou risques de double compte"
      description: "Préciser les sous-totaux, les mesures liées et les risques de double compte. Un groupe est une vue : ne jamais l’ajouter au total de ses composantes."
  - type: checkboxes
    id: verifications
    attributes:
      label: "Vérifications"
      options:
        - label: "Je distingue les montants revendiqués des résultats calculés par le site."
          required: true
        - label: "Je comprends que la représentation officielle et le chiffrage doivent être vérifiés indépendamment."
          required: true
        - label: "Je comprends qu’aucun groupe ou montant non validé ne sera automatiquement activé dans le moteur."
          required: true
